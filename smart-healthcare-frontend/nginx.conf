server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the paths, so an unknown path falls back to index.html
    # instead of returning 404 on a page refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The built files are hashed, so a miss here is a real 404 and must not
    # fall back to index.html and be served as HTML
    location /assets/ {
        try_files $uri =404;
    }

    # The app calls /api, which nginx passes to the backend container
    location /api/ {
        proxy_pass http://healthcare-app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
